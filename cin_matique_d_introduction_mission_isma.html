<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISSION ISMA — Pitch Intro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #050914;
      --cyan: #38bdf8;
      --orange: #f97316;
      --amber: #facc15;
      --red: #ef4444;
      --emerald: #10b981;
      --turquoise: #2dd4bf;
    }

    body {
      background-color: #03060d;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .font-pixel {
      font-family: 'Press Start 2P', monospace;
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Effet CRT Scanlines & Vignette cinéma */
    .crt-vignette {
      background:
        radial-gradient(circle at center, transparent 55%, rgba(2, 6, 23, 0.85) 100%),
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.32) 50%);
      background-size: 100% 100%, 100% 4px;
      pointer-events: none;
    }

    /* Animations cinétiques de coupe franche style bande-annonce */
    @keyframes slamIn {
      0% {
        opacity: 0;
        transform: scale(1.35);
        filter: brightness(2.5);
      }
      18% {
        opacity: 1;
        transform: scale(0.98);
        filter: brightness(1.2);
      }
      30% {
        transform: scale(1);
        filter: brightness(1);
      }
      100% {
        opacity: 1;
        transform: scale(1.03);
      }
    }

    @keyframes glitchShake {
      0%, 100% { transform: translate(0, 0); }
      15% { transform: translate(-6px, 3px); }
      30% { transform: translate(6px, -4px); }
      45% { transform: translate(-5px, -2px); }
      60% { transform: translate(5px, 4px); }
      75% { transform: translate(-3px, 2px); }
    }

    @keyframes redAlertPulse {
      0%, 100% { background-color: rgba(239, 68, 68, 0); }
      50% { background-color: rgba(239, 68, 68, 0.18); }
    }

    .animate-slam {
      animation: slamIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-shake {
      animation: glitchShake 0.35s ease-in-out;
    }

    .alert-flash-bg {
      animation: redAlertPulse 0.45s ease-in-out 2;
    }

    .btn-arcade {
      transition: transform 0.08s ease, filter 0.12s ease;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.45), 0 4px 0 #020617;
    }
    .btn-arcade:hover {
      filter: brightness(1.15);
    }
    .btn-arcade:active {
      transform: translateY(2px);
      box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.45), 0 1px 0 #020617;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between p-2 sm:p-4">

  <!-- ========================================================================= -->
  <!-- BARRE DE CONTRÔLE SUPÉRIEURE (REPLAY, PAUSE, PACE 2.0s, SFX, SKIP)        -->
  <!-- ========================================================================= -->
  <header class="w-full max-w-6xl bg-slate-900/90 border-2 border-slate-700 rounded-xl px-3 py-2 flex flex-wrap items-center justify-between gap-2 z-30 shadow-lg">
    <div class="flex items-center gap-2.5">
      <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-sky-400 animate-ping"></span>
      <span class="font-pixel text-[9px] sm:text-[10px] text-sky-400 tracking-wider">MISSION ISMA • PITCH INTRO</span>
      <span id="beatCounter" class="font-pixel text-[8px] px-2 py-0.5 bg-slate-800 border border-slate-600 text-slate-300 rounded">
        BEAT 01/09
      </span>
    </div>

    <div class="flex flex-wrap items-center gap-1.5">
      <button id="replayBtn" class="btn-arcade px-2.5 py-1.5 rounded bg-sky-600 hover:bg-sky-500 text-white border border-sky-300 font-pixel text-[8px] sm:text-[9px]">
        ↺ REPLAY
      </button>
      <button id="pauseBtn" class="btn-arcade px-2.5 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-600 font-pixel text-[8px] sm:text-[9px]">
        ⏸ PAUSE
      </button>
      <button id="speedBtn" class="btn-arcade px-2.5 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-purple-300 border border-slate-600 font-pixel text-[8px] sm:text-[9px]" title="Change cadence">
        ⚡ PACE: 2.0s
      </button>
      <button id="soundBtn" class="btn-arcade px-2.5 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-600 font-pixel text-[8px] sm:text-[9px]">
        🔊 SFX: ON
      </button>
      <button id="skipBtn" class="btn-arcade px-2.5 py-1.5 rounded bg-rose-700 hover:bg-rose-600 text-white border border-rose-400 font-pixel text-[8px] sm:text-[9px]">
        SKIP [ESC] ⏭
      </button>
    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- ÉCRAN CINÉMA 16:9 AVEC BARRES LETTERBOX, CHAMP D'ÉTOILES & TEXTE FLASH    -->
  <!-- ========================================================================= -->
  <main id="cinemaFrame" class="w-full max-w-6xl relative aspect-video bg-[#050914] border-4 border-slate-700 rounded-2xl overflow-hidden shadow-[0_0_70px_rgba(0,0,0,0.95)] my-auto flex flex-col justify-between">

    <!-- CANVAS ARRIÈRE-PLAN : CHAMP D'ÉTOILES EN VITESSE LUMIÈRE -->
    <canvas id="starfieldCanvas" width="320" height="180" class="absolute inset-0 w-full h-full object-cover z-0"></canvas>

    <!-- OVERLAY FLASH D'ALERTE & CRT SCANLINES -->
    <div id="alertFlashLayer" class="absolute inset-0 z-10 pointer-events-none"></div>
    <div class="crt-vignette absolute inset-0 z-20"></div>

    <!-- BARRE NOIRE CINÉMA SUPÉRIEURE (LETTERBOX) AVEC TIMECODE -->
    <div class="relative z-30 w-full h-10 sm:h-12 bg-black/90 border-b border-slate-800/80 px-4 flex items-center justify-between font-pixel text-[8px] text-slate-500">
      <div class="flex items-center gap-2">
        <span class="text-rose-500">● REC</span>
        <span>CAM-ISMA-01</span>
      </div>
      <div id="timecodeDisplay" class="text-slate-400">TC 00:00:01:12</div>
      <div class="text-sky-400/80 hidden sm:block">NASA SPACE APPS // PITCH INTRO</div>
    </div>

    <!-- ======================================================================= -->
    <!-- SCÈNE CENTRALE D'IMPACT : TEXTES EN ANGLAIS (CADENCE 2.0S)             -->
    <!-- ======================================================================= -->
    <div id="stageContainer" class="relative z-30 flex-1 w-full flex flex-col items-center justify-center px-6 sm:px-14 text-center overflow-hidden">
      <!-- Le contenu de chaque plan est injecté ici -->
    </div>

    <!-- BARRE NOIRE CINÉMA INFÉRIEURE (LETTERBOX) AVEC JAUGE DE PROGRESSION -->
    <div class="relative z-30 w-full h-10 sm:h-12 bg-black/90 border-t border-slate-800/80 px-4 flex items-center justify-between gap-4">
      <span class="font-pixel text-[8px] text-slate-500 shrink-0">INTRO SEQUENCE</span>
      <div class="w-full h-1.5 bg-slate-900 border border-slate-700 rounded overflow-hidden">
        <div id="timelineBar" class="h-full bg-white transition-all duration-150" style="width: 0%"></div>
      </div>
      <span id="speedIndicator" class="font-pixel text-[8px] text-amber-400 shrink-0">5 MIN MISSION</span>
    </div>

  </main>

  <!-- ========================================================================= -->
  <!-- TIMELINE INTERACTIVE DES 9 PLANS EN BAS D'ÉCRAN                           -->
  <!-- ========================================================================= -->
  <footer class="w-full max-w-6xl flex flex-col sm:flex-row items-center justify-between gap-2 px-1 text-xs text-slate-400">
    <div class="flex items-center gap-1.5 flex-wrap justify-center" id="beatDotsContainer"></div>
    <div class="font-pixel text-[8px] text-slate-500">
      CLICK SCREEN TO ADVANCE • [SPACE] PAUSE
    </div>
  </footer>

  <!-- ========================================================================= -->
  <!-- SCRIPT : SÉQUENCEUR CINÉTIQUE (EN ANGLAIS, CADENCE 2.0S, 5 MIN MISSION)   -->
  <!-- ========================================================================= -->
  <script>
    /**
     * 1. SYNTHÉTISEUR AUDIO 8-BIT
     */
    const TrailerAudio = {
      enabled: true,
      ctx: null,
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      bassHit(freq = 95, dur = 0.22) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(28, now + dur);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + dur);
        } catch (e) {}
      },
      wordTick(freq = 680) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.055);
        } catch (e) {}
      },
      redAlert() {
        if (!this.enabled) return;
        this.bassHit(130, 0.28);
        setTimeout(() => this.wordTick(320), 60);
        setTimeout(() => this.wordTick(240), 160);
      },
      titleChord() {
        if (!this.enabled) return;
        this.bassHit(110, 0.45);
        [261.63, 329.63, 392.00, 523.25].forEach((f, idx) => {
          setTimeout(() => this.wordTick(f), idx * 55);
        });
      }
    };

    /**
     * 2. LES 9 PLANS EN ANGLAIS (CADENCE EXACTE DE 2.0 SECONDES)
     */
    const INTRO_BEATS = [
      {
        id: 1,
        duration: 2000,
        warpSpeed: 0.6,
        sound: 'tick',
        kicker: 'INCOMING TRANSMISSION // NASA SPACE APPS',
        mainText: 'YEAR 2026.',
        subText: '',
        colorClass: 'text-white',
        sizeClass: 'text-2xl sm:text-4xl md:text-5xl'
      },
      {
        id: 2,
        duration: 2000,
        warpSpeed: 1.2,
        sound: 'bass',
        kicker: 'COORDINATES LOCKED',
        mainText: 'LOW ORBIT — <span class="text-orange-500">MARS SECTOR.</span>',
        subText: '',
        colorClass: 'text-white',
        sizeClass: 'text-xl sm:text-3xl md:text-4xl'
      },
      {
        id: 3,
        duration: 2000,
        warpSpeed: 1.8,
        sound: 'bass',
        kicker: 'SURVIVAL REPORT',
        mainText: 'SPACE FORGIVES <span class="text-sky-400">NO MISTAKES.</span>',
        subText: '',
        colorClass: 'text-white',
        sizeClass: 'text-lg sm:text-2xl md:text-3xl'
      },
      {
        id: 4,
        duration: 2000,
        warpSpeed: 2.5,
        sound: 'multi',
        type: 'wordStack',
        words: [
          { label: 'OXYGEN.', color: '#2dd4bf' },
          { label: 'WATER.', color: '#38bdf8' },
          { label: 'ENERGY.', color: '#facc15' },
          { label: 'PROPULSION.', color: '#f97316' }
        ]
      },
      {
        id: 5,
        duration: 2000,
        warpSpeed: 4.2,
        sound: 'alert',
        shake: true,
        alertFlash: true,
        kicker: '⚠ SYSTEM FAILURE IMMINENT',
        mainText: 'ONE GAUGE DROPS TO <span class="text-rose-500">0%</span>',
        subText: 'AND THE STATION IS LOST.',
        colorClass: 'text-white',
        sizeClass: 'text-xl sm:text-3xl md:text-4xl'
      },
      {
        id: 6,
        duration: 2000,
        warpSpeed: 5.5,
        sound: 'alert',
        shake: true,
        kicker: 'CONTROL ROOM • EMERGENCY PROTOCOL',
        mainText: '<span class="text-amber-400">5 MINUTES</span> MISSION.',
        subText: 'TO DEFY THE CHAOS.',
        colorClass: 'text-white',
        sizeClass: 'text-2xl sm:text-4xl md:text-5xl'
      },
      {
        id: 7,
        duration: 2000,
        warpSpeed: 3.5,
        sound: 'bass',
        kicker: 'ENGINEERING PHASE',
        mainText: 'DRAFT YOUR <span class="text-sky-400">CARDS.</span>',
        subText: 'ASSEMBLE YOUR MODULES.',
        colorClass: 'text-white',
        sizeClass: 'text-xl sm:text-3xl md:text-4xl'
      },
      {
        id: 8,
        duration: 2000,
        warpSpeed: 6.5,
        sound: 'bass',
        kicker: 'ULTIMATE DIRECTIVE',
        mainText: 'EVERY CHOICE DECIDES YOUR <span class="text-emerald-400">SURVIVAL.</span>',
        subText: '',
        colorClass: 'text-white',
        sizeClass: 'text-lg sm:text-2xl md:text-3xl'
      },
      {
        id: 9,
        duration: 999999,
        warpSpeed: 1.0,
        sound: 'chord',
        type: 'finalReveal'
      }
    ];

    /**
     * 3. ÉTAT DU SÉQUENCEUR (CADENCE PAR DÉFAUT 2.0S)
     */
    const state = {
      currentBeatIndex: 0,
      paused: false,
      speedMultiplier: 1.0, // 1.0 * 2000ms = 2.0s par plan
      warpFactor: 1.0,
      tick: 0,
      beatTimeout: null,
      subTimeouts: []
    };

    const stage = document.getElementById('stageContainer');
    const cinemaFrame = document.getElementById('cinemaFrame');
    const alertFlashLayer = document.getElementById('alertFlashLayer');
    const timelineBar = document.getElementById('timelineBar');
    const beatCounter = document.getElementById('beatCounter');

    function clearAllTimers() {
      if (state.beatTimeout) clearTimeout(state.beatTimeout);
      state.subTimeouts.forEach(t => clearTimeout(t));
      state.subTimeouts = [];
    }

    function playBeat(index) {
      clearAllTimers();

      if (index >= INTRO_BEATS.length) {
        index = INTRO_BEATS.length - 1;
      }
      if (index < 0) index = 0;

      state.currentBeatIndex = index;
      const beat = INTRO_BEATS[index];
      state.warpFactor = beat.warpSpeed || 1.0;

      beatCounter.textContent = `BEAT 0${index + 1}/0${INTRO_BEATS.length}`;
      const pct = ((index + 1) / INTRO_BEATS.length) * 100;
      timelineBar.style.width = `${pct}%`;
      updateBeatDots();

      cinemaFrame.classList.remove('animate-shake');
      alertFlashLayer.classList.remove('alert-flash-bg');
      void cinemaFrame.offsetWidth;

      if (beat.shake) cinemaFrame.classList.add('animate-shake');
      if (beat.alertFlash) alertFlashLayer.classList.add('alert-flash-bg');

      if (beat.sound === 'tick') TrailerAudio.wordTick(620);
      else if (beat.sound === 'bass') TrailerAudio.bassHit(95, 0.24);
      else if (beat.sound === 'alert') TrailerAudio.redAlert();
      else if (beat.sound === 'chord') TrailerAudio.titleChord();

      stage.innerHTML = '';

      if (beat.type === 'wordStack') {
        const wrap = document.createElement('div');
        wrap.className = 'grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-5 w-full max-w-3xl';
        stage.appendChild(wrap);

        const stepDelay = Math.round(420 * state.speedMultiplier);
        beat.words.forEach((w, wIdx) => {
          const t = setTimeout(() => {
            TrailerAudio.wordTick(480 + wIdx * 110);
            const item = document.createElement('div');
            item.className = 'animate-slam bg-slate-950/90 border-2 px-4 py-3 sm:py-4 rounded-lg font-pixel text-sm sm:text-xl md:text-2xl tracking-wider shadow-lg';
            item.style.borderColor = w.color;
            item.style.color = w.color;
            item.textContent = w.label;
            wrap.appendChild(item);
          }, wIdx * stepDelay);
          state.subTimeouts.push(t);
        });

      } else if (beat.type === 'finalReveal') {
        const finalBox = document.createElement('div');
        finalBox.className = 'animate-slam flex flex-col items-center justify-center gap-4 max-w-2xl';
        finalBox.innerHTML = `
          <div class="flex items-center gap-4 mb-1">
            <canvas id="miniLogoCanvas" width="64" height="32" class="w-24 h-12 sm:w-32 sm:h-16"></canvas>
          </div>
          <div class="px-3 py-1 bg-sky-500/20 border border-sky-400 text-sky-300 font-pixel text-[8px] sm:text-[9px] tracking-widest">
            NASA SPACE APPS CHALLENGE • PITCH INTRO
          </div>
          <h1 class="font-pixel text-2xl sm:text-4xl md:text-5xl text-white tracking-wider drop-shadow-[0_4px_0_#0284c7]">
            MISSION ISMA
          </h1>
          <p class="font-pixel text-[9px] sm:text-xs text-amber-400 tracking-widest">
            5 MINUTES TO ASSEMBLE YOUR STATION
          </p>
          <div class="flex flex-wrap items-center justify-center gap-3 mt-3">
            <button id="finalStartBtn" class="btn-arcade px-5 py-3 bg-emerald-600 hover:bg-emerald-500 text-white border-2 border-emerald-300 font-pixel text-[10px] sm:text-xs rounded-lg shadow-[0_0_25px_rgba(16,185,129,0.5)]">
              ▶ START MISSION (5 MIN)
            </button>
            <button id="finalReplayBtn" class="btn-arcade px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 border-2 border-slate-600 font-pixel text-[10px] sm:text-xs rounded-lg">
              ↺ REPLAY TEASER
            </button>
          </div>
        `;
        stage.appendChild(finalBox);
        drawFinalPixelBadge();

        document.getElementById('finalReplayBtn').addEventListener('click', (e) => {
          e.stopPropagation();
          TrailerAudio.init();
          state.paused = false;
          updatePauseButtonUI();
          playBeat(0);
        });

        document.getElementById('finalStartBtn').addEventListener('click', (e) => {
          e.stopPropagation();
          TrailerAudio.titleChord();
          showLaunchConfirmation();
        });

      } else {
        const box = document.createElement('div');
        box.className = 'animate-slam flex flex-col items-center justify-center gap-3 max-w-4xl';
        box.innerHTML = `
          ${beat.kicker ? `<span class="font-pixel text-[8px] sm:text-[10px] text-slate-400 tracking-[0.2em] uppercase">${beat.kicker}</span>` : ''}
          <h2 class="font-pixel ${beat.sizeClass} ${beat.colorClass} leading-snug tracking-wide drop-shadow-[0_4px_12px_rgba(255,255,255,0.2)]">
            ${beat.mainText}
          </h2>
          ${beat.subText ? `<p class="font-pixel text-xs sm:text-base md:text-lg text-slate-300 mt-1 tracking-wider">${beat.subText}</p>` : ''}
        `;
        stage.appendChild(box);
      }

      if (!state.paused && index < INTRO_BEATS.length - 1) {
        const delay = Math.round(beat.duration * state.speedMultiplier);
        state.beatTimeout = setTimeout(() => {
          playBeat(index + 1);
        }, delay);
      }
    }

    function showLaunchConfirmation() {
      stage.innerHTML = `
        <div class="animate-slam bg-slate-900/95 border-2 border-emerald-400 p-6 rounded-xl max-w-lg text-center flex flex-col items-center gap-4 shadow-2xl">
          <span class="px-2.5 py-1 bg-emerald-600 text-white font-pixel text-[8px] rounded">TRANSITION TO GAME</span>
          <h3 class="font-pixel text-base sm:text-lg text-white">MISSION CONTROL READY!</h3>
          <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">
            The pitch intro is complete. In your main project, this button seamlessly transitions to <strong class="text-sky-300">Mission ISMA</strong>.
          </p>
          <button id="backToIntroBtn" class="btn-arcade px-4 py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-pixel text-[9px] rounded border border-sky-300">
            ↺ REPLAY INTRO
          </button>
        </div>
      `;
      document.getElementById('backToIntroBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        playBeat(0);
      });
    }

    function drawFinalPixelBadge() {
      const cEl = document.getElementById('miniLogoCanvas');
      if (!cEl) return;
      const c = cEl.getContext('2d');
      c.imageSmoothingEnabled = false;
      c.clearRect(0, 0, 64, 32);

      c.fillStyle = '#9a3412';
      c.fillRect(42, 6, 18, 20);
      c.fillStyle = '#ea580c';
      c.fillRect(44, 8, 14, 16);
      c.fillStyle = '#f8fafc';
      c.fillRect(47, 6, 8, 2);

      c.fillStyle = '#ea580c';
      c.fillRect(6, 14, 5, 4);
      c.fillStyle = '#facc15';
      c.fillRect(9, 15, 2, 2);
      c.fillStyle = '#dc2626';
      c.fillRect(11, 10, 3, 2);
      c.fillRect(11, 20, 3, 2);
      c.fillStyle = '#f8fafc';
      c.fillRect(11, 12, 12, 8);
      c.fillStyle = '#dc2626';
      c.fillRect(23, 13, 3, 6);
      c.fillRect(26, 15, 2, 2);
      c.fillStyle = '#38bdf8';
      c.fillRect(16, 14, 4, 4);
    }

    const sCanvas = document.getElementById('starfieldCanvas');
    const sCtx = sCanvas.getContext('2d');
    sCtx.imageSmoothingEnabled = false;

    const stars = Array.from({ length: 75 }, () => ({
      x: (Math.random() - 0.5) * 320,
      y: (Math.random() - 0.5) * 180,
      z: Math.random() * 160 + 10,
      color: Math.random() > 0.75 ? '#38bdf8' : (Math.random() > 0.9 ? '#f97316' : '#f8fafc')
    }));

    function renderStarfield() {
      state.tick++;
      sCtx.fillStyle = '#050914';
      sCtx.fillRect(0, 0, 320, 180);

      const cx = 160;
      const cy = 90;
      const speed = state.paused ? 0.15 : state.warpFactor;

      stars.forEach(st => {
        st.z -= speed;
        if (st.z <= 2) {
          st.x = (Math.random() - 0.5) * 320;
          st.y = (Math.random() - 0.5) * 180;
          st.z = 160;
        }

        const sx = Math.round(cx + (st.x / st.z) * 90);
        const sy = Math.round(cy + (st.y / st.z) * 90);

        if (sx >= 0 && sx < 320 && sy >= 0 && sy < 180) {
          sCtx.fillStyle = st.color;
          const size = st.z < 45 ? 2 : 1;
          if (speed >= 3.5 && st.z < 90) {
            const tail = Math.min(8, Math.round(speed * 1.4));
            sCtx.fillRect(sx, sy, tail, 1);
          } else {
            sCtx.fillRect(sx, sy, size, size);
          }
        }
      });

      if (!state.paused && state.tick % 3 === 0) {
        const sec = String(state.currentBeatIndex + 1).padStart(2, '0');
        const frm = String(state.tick % 24).padStart(2, '0');
        document.getElementById('timecodeDisplay').textContent = `TC 00:00:${sec}:${frm}`;
      }

      requestAnimationFrame(renderStarfield);
    }

    function initBeatDots() {
      const container = document.getElementById('beatDotsContainer');
      container.innerHTML = '';
      INTRO_BEATS.forEach((b, idx) => {
        const btn = document.createElement('button');
        btn.className = 'beat-dot font-pixel text-[8px] px-2 py-1 rounded border transition';
        btn.textContent = `0${idx + 1}`;
        btn.title = `Go to Beat ${idx + 1}`;
        btn.addEventListener('click', () => {
          TrailerAudio.init();
          playBeat(idx);
        });
        container.appendChild(btn);
      });
    }

    function updateBeatDots() {
      document.querySelectorAll('.beat-dot').forEach((btn, idx) => {
        if (idx === state.currentBeatIndex) {
          btn.className = 'beat-dot font-pixel text-[8px] px-2 py-1 rounded border bg-sky-600 text-white border-sky-300';
        } else if (idx < state.currentBeatIndex) {
          btn.className = 'beat-dot font-pixel text-[8px] px-2 py-1 rounded border bg-slate-800 text-sky-400 border-slate-600';
        } else {
          btn.className = 'beat-dot font-pixel text-[8px] px-2 py-1 rounded border bg-slate-900 text-slate-500 border-slate-800';
        }
      });
    }

    function updatePauseButtonUI() {
      const pauseBtn = document.getElementById('pauseBtn');
      const dot = document.getElementById('statusDot');
      if (state.paused) {
        pauseBtn.textContent = '▶ PLAY';
        dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400';
      } else {
        pauseBtn.textContent = '⏸ PAUSE';
        dot.className = 'w-2.5 h-2.5 rounded-full bg-sky-400 animate-ping';
      }
    }

    document.getElementById('replayBtn').addEventListener('click', () => {
      TrailerAudio.init();
      state.paused = false;
      updatePauseButtonUI();
      playBeat(0);
    });

    document.getElementById('pauseBtn').addEventListener('click', () => {
      TrailerAudio.init();
      state.paused = !state.paused;
      updatePauseButtonUI();
      if (state.paused) {
        clearAllTimers();
      } else {
        playBeat(state.currentBeatIndex);
      }
    });

    document.getElementById('speedBtn').addEventListener('click', (e) => {
      TrailerAudio.init();
      if (state.speedMultiplier === 1.0) {
        state.speedMultiplier = 0.6;
        e.target.textContent = '⚡ PACE: 1.2s';
      } else if (state.speedMultiplier === 0.6) {
        state.speedMultiplier = 1.4;
        e.target.textContent = '⚡ PACE: 2.8s';
      } else {
        state.speedMultiplier = 1.0;
        e.target.textContent = '⚡ PACE: 2.0s';
      }
      playBeat(0);
    });

    document.getElementById('soundBtn').addEventListener('click', (e) => {
      TrailerAudio.enabled = !TrailerAudio.enabled;
      e.target.textContent = TrailerAudio.enabled ? '🔊 SFX: ON' : '🔇 SFX: OFF';
      e.target.className = `btn-arcade px-2.5 py-1.5 rounded bg-slate-800 hover:bg-slate-700 ${TrailerAudio.enabled ? 'text-emerald-400' : 'text-slate-400'} border border-slate-600 font-pixel text-[8px] sm:text-[9px]`;
    });

    document.getElementById('skipBtn').addEventListener('click', () => {
      TrailerAudio.init();
      playBeat(INTRO_BEATS.length - 1);
    });

    cinemaFrame.addEventListener('click', () => {
      TrailerAudio.init();
      if (state.currentBeatIndex < INTRO_BEATS.length - 1) {
        playBeat(state.currentBeatIndex + 1);
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Escape') {
        document.getElementById('skipBtn').click();
      } else if (e.code === 'Space') {
        e.preventDefault();
        document.getElementById('pauseBtn').click();
      } else if (e.code === 'ArrowRight') {
        if (state.currentBeatIndex < INTRO_BEATS.length - 1) {
          playBeat(state.currentBeatIndex + 1);
        }
      } else if (e.code === 'ArrowLeft') {
        if (state.currentBeatIndex > 0) {
          playBeat(state.currentBeatIndex - 1);
        }
      }
    });

    window.addEventListener('load', () => {
      initBeatDots();
      renderStarfield();
      setTimeout(() => playBeat(0), 300);
    });
  </script>
</body>
</html>
